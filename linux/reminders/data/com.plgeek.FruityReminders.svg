  <path d="M38 46.2l2.9 2.9 5.4-5.6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="43" width="34" height="6" rx="3" fill="#c9ccd8"/>
