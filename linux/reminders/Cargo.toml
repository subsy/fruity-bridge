[package]
name = "fruity-reminders"
version = "0.1.0"
edition = "2024"
description = "Your Apple Reminders on Linux, served by your Mac over Tailscale"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
fruity-bridge-client = { version = "0.1.0", path = "../client" }
fruity-bridge-gtk = { version = "0.1.0", path = "../gtk-common" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
jiff = "0.2.24"
serde = { version = "1.0.229", features = ["derive"] }
