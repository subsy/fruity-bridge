<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#f6b434"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f3ea"/>
    </linearGradient>
  </defs>
  <!-- base thickness -->
  <rect x="10" y="18" width="108" height="102" rx="18" fill="#c4821a"/>
  <!-- cover -->
  <rect x="10" y="10" width="108" height="102" rx="18" fill="url(#cover)"/>
  <rect x="10.5" y="10.5" width="107" height="101" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <!-- page shadow and page, tilted a touch -->
  <g transform="rotate(-4 64 64)">
    <rect x="24" y="27" width="80" height="78" rx="9" fill="#7a4a06" fill-opacity="0.22"/>
    <path d="M 33 23 H 95 a 9 9 0 0 1 9 9 V 82 L 82 102 H 33 a 9 9 0 0 1 -9 -9 V 32 a 9 9 0 0 1 9 -9 z" fill="url(#page)"/>
    <!-- folded corner -->
    <path d="M 104 82 L 82 102 V 90 a 8 8 0 0 1 8 -8 z" fill="#e8dfc6"/>
    <!-- check glyph and title line -->
    <circle cx="40" cy="42" r="7" fill="#f6b434"/>
    <path d="M 36.6 42.2 L 39.2 44.8 L 43.8 39.6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="53" y="38.5" width="38" height="7" rx="3.5" fill="#3d3846"/>
    <!-- body lines -->
    <rect x="34" y="58" width="58" height="5" rx="2.5" fill="#c0bfbc"/>
    <rect x="34" y="70" width="52" height="5" rx="2.5" fill="#c0bfbc"/>
    <rect x="34" y="82" width="36" height="5" rx="2.5" fill="#c0bfbc"/>
  </g>
</svg>
